name: Build and Package QuackStore

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK Build-Tools
        uses: android-actions/setup-android@v4
        with:
          packages: 'build-tools;36.0.0'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
          add-to-path: true

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Setup Node.js and pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: Setup Node environment
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: Build WebUI
        run: |
          cd ui
          pnpm install --frozen-lockfile
          pnpm build

      - name: Build QuackStore Rust Backend
        run: |
          cargo ndk -t arm64-v8a build --package quackd --release

      - name: Package KernelSU Module Zip
        run: |
          mkdir -p dist module/bin
          cp target/aarch64-linux-android/release/quackd module/bin/quackd
          chmod 755 module/bin/quackd module/bin/quackctl.sh module/*.sh
          cd module
          zip -r ../dist/quack-store-v1.0.0-alpha.zip ./*

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: quack-store-v1.0.0-alpha
          path: dist/quack-store-v1.0.0-alpha.zip

      - name: Release on Tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/quack-store-v1.0.0-alpha.zip
          draft: false
          prerelease: false
          generate_release_notes: true
